# Cloudflare Worker for Quippy's live rooms + API (D1 + R2 + Durable Objects).
# The website itself is deployed to Vercel (quippy.party). See docs/DEPLOY.md.
name = "quippy-live"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Point a subdomain at the Worker. Phones and the TV open WebSockets here.
routes = [{ pattern = "live.quippy.party", custom_domain = true }]

[vars]
PUBLIC_URL = "https://quippy.party"
ALLOWED_ORIGINS = "https://quippy.party,https://www.quippy.party"
QUIPPY_LOCALE = "en-AU"
# AI brain for Callback Club. "vercel" = Vercel AI Gateway (set the
# AI_GATEWAY_API_KEY secret). Model ids use the gateway's "creator/model" form.
LLM_PROVIDER = "vercel"
# LLM_MODEL = "anthropic/claude-opus-5.5"
# Voice: set ELEVENLABS_API_KEY + ELEVENLABS_VOICE_ID secrets to use ElevenLabs,
# otherwise the TV uses its browser's speech voices.

# Secrets (wrangler secret put <NAME>):
#   AI_GATEWAY_API_KEY, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID

[[d1_databases]]
binding = "DB"
database_name = "quippy"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "quippy-media"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
