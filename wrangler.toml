# Cloudflare Worker for Quippy's live rooms + API (D1 + R2 + Durable Objects).
# The website itself is deployed to Vercel (quippy.party). See docs/DEPLOY.md.
name = "quippy-live"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Point a subdomain at the Worker. Phones and the TV open WebSockets here.
routes = [{ pattern = "live.quippy.party", custom_domain = true }]

[vars]
PUBLIC_URL = "https://quippy.party"
ALLOWED_ORIGINS = "https://quippy.party,https://www.quippy.party"
QUIPPY_LOCALE = "en-AU"
# AI brain for Callback Club. "vercel" = Vercel AI Gateway (set the
# AI_GATEWAY_API_KEY secret). Model ids use the gateway's "creator/model" form.
LLM_PROVIDER = "vercel"
# LLM_MODEL = "anthropic/claude-opus-5.5"
# Voice: production speaks through Gemini TTS on the AI Gateway (same key),
# then ElevenLabs if configured. A Worker can't reach a model on your laptop, so
# ElevenLabs (set ELEVENLABS_API_KEY + ELEVENLABS_VOICE_ID secrets) and otherwise
# the TV's browser voices. To use your local voice model in production, expose it
# (e.g. a Cloudflare Tunnel) and set TTS_PROVIDER = "local,elevenlabs" + TTS_LOCAL_URL.
TTS_PROVIDER = "gateway,elevenlabs"
# Picture Duel images via the AI Gateway (same key). Pictures + reference photos
# are stored in the MEDIA R2 bucket under gen/ and ref/.
# IMAGE_MODEL = "bfl/flux-3-image-klein"   # default; or openai/gpt-image-1-mini,
#   recraft/recraft-v4.1-flash, bytedance/seedream-5.5, bfl/flux-3-image
# IMAGE_PROVIDER = "none"                  # placeholders only (no image spend)
# Product analytics: PostHog project "Quippy" (US Cloud). The project token is
# public (it also ships to browsers); safe-deploy passes it to the Vercel build.
POSTHOG_KEY = "phc_pXy5DhLkodfAx4b7n9YaUnJt6QkfVXJs4Rzr25zB4Fi7"
POSTHOG_HOST = "https://us.i.posthog.com"

# Secrets (wrangler secret put <NAME>):
#   AI_GATEWAY_API_KEY, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID

[[d1_databases]]
binding = "DB"
database_name = "quippy"
database_id = "6ec97ba8-577d-48dc-872e-03a4d66916e0"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "quippy-media"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
